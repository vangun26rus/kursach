<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <nav class="links top-nav">
      <div class="nav-left">
        <a href="index.html">⌂ Главная</a>
        <a href="catalog.html">Каталог</a>
        
      </div>
    </nav>
    <h1>Нужна помощь?</h1>
    <section id="supportAuthNotice" class="panel">
      <h2>Вход для работы с обращениями</h2>
      <p class="muted">Чтобы отправлять обращения и писать в чат поддержки, нужно войти в систему.</p>
      <div class="stack-inline">
        <button id="supportLoginBtn" type="button" class="secondary">Войти</button>
        <button id="supportRegisterBtn" type="button">Регистрация</button>
      </div>
    </section>

    <section class="panel">
      <h2>Сообщить об ошибке</h2>
      <form id="ticketForm" class="stack">
        <label for="ticketKind">Тип обращения</label>
        <select id="ticketKind">
          <option value="QuickHelp">Быстрая помощь (чат с экспертами)</option>
          <option value="TechnicalIssue">Техническая ошибка (только администратор)</option>
        </select>
        <input id="ticketSubject" type="text" placeholder="Тема обращения" required>
        <textarea id="ticketDescription" rows="4" placeholder="Опишите проблему" required></textarea>
        <button type="submit">Отправить обращение</button>
      </form>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Обращения о технических ошибках</h2>
        <ul id="ticketsList"></ul>
        <form id="ticketReplyForm" class="stack">
          <textarea id="ticketReplyText" rows="3" placeholder="Ответ администратора на обращение"></textarea>
          <button type="submit">Отправить ответ</button>
        </form>
        <ul id="ticketMessages"></ul>
      </section>

      <section class="panel">
        <h2>Чат быстрой помощи по статьям</h2>
        <ul id="roomsList"></ul>
        <form id="chatForm" class="stack">
          <textarea id="chatText" rows="3" placeholder="Сообщение в чат быстрой помощи"></textarea>
          <button type="submit">Отправить в чат</button>
        </form>
        <ul id="chatMessages"></ul>
      </section>
    </div>

    <p id="supportStatus" class="status"></p>
  </main>

  <script src="js/app.js"></script>
  <script src="js/support.js"></script>
</body>
</html>
