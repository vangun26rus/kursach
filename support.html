<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <nav class="links top-nav">
      <div class="nav-left">
      <a href="index.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;margin-right:6px;"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
          Главная
        </a>
        <a href="catalog.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;margin-right:6px;"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          Каталог
        </a>
        
      </div>
    </nav>
    <h1>Нужна помощь?</h1>
    <section id="supportAuthNotice" class="panel">
      <h2>Вход для работы с обращениями</h2>
      <p class="muted">Чтобы отправлять обращения и писать в чат поддержки, нужно войти в систему.</p>
      <div class="stack-inline">
        <button id="supportLoginBtn" type="button" class="secondary">Войти</button>
        <button id="supportRegisterBtn" type="button">Регистрация</button>
      </div>
    </section>

    <section class="panel">
      <h2>Сообщить об ошибке</h2>
      <form id="ticketForm" class="stack">
        <label>Тип обращения</label>
        <div id="ticketKindSelector" class="kind-selector" role="radiogroup" aria-label="Тип обращения">
          <button type="button" class="kind-option selected" data-kind="QuickHelp" aria-pressed="true">Быстрая помощь</button>
          <button type="button" class="kind-option" data-kind="TechnicalIssue" aria-pressed="false">Техническая ошибка</button>
        </div>
        <select id="ticketKind" hidden>
          <option value="QuickHelp">Быстрая помощь</option>
          <option value="TechnicalIssue">Техническая ошибка</option>
        </select>
        <input id="ticketSubject" type="text" placeholder="Тема обращения" required>
        <div class="reply-panel ticket-compose">
          <textarea id="ticketDescription" class="reply-textarea" rows="1" placeholder="Опишите проблему" required></textarea>
          <button type="submit" class="send-round-btn" aria-label="Отправить обращение">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 5l8 7-8 7V5z" />
            </svg>
          </button>
        </div>
      </form>
    </section>

    <div class="grid">
      <section class="panel">
        <div class="section-title">
          <span class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2L3 14h7v8l10-12h-7V2z" />
            </svg>
          </span>
          <h2>Быстрый чат</h2>
        </div>
        <ul id="roomsList" class="support-list"></ul>
      </section>
      
      <section class="panel">
        <div class="section-title">
          <span class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
          </span>
          <h2>Технические ошибки</h2>
        </div>
        <ul id="ticketsList" class="support-list"></ul>
      </section>

      
    </div>

    <p id="supportStatus" class="status"></p>
  </main>

  <script src="js/app.js?v=5"></script>
  <script src="js/support.js?v=5"></script>
</body>
</html>
