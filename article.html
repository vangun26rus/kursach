<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статья</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <nav class="links top-nav">
      <div class="nav-left">
        <a href="index.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;margin-right:6px;"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
          Главная
        </a>
        <a href="catalog.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;margin-right:6px;"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          Каталог
        </a>
      </div>
      <div class="nav-right">
          <a href="support.html" class="help-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <circle cx="9" cy="9" r="1"></circle>
            <circle cx="15" cy="9" r="1"></circle>
            <path d="M9 13h.01"></path>
            <path d="M15 13h.01"></path>
            <path d="M10 17h4"></path>
          </svg>
          Нужна помощь?
        </a>
        <button id="articleLoginBtnNav" type="button" class="secondary" style="height:48px;">Войти</button>
        <button id="articleRegisterBtnNav" type="button" style="height:48px;">Регистрация</button>

      </div>
    </nav>

    <h1 id="title">Загрузка...</h1>
    <div id="meta" class="meta"></div>
    <div class="article-actions">
      <button id="favoriteToggle" type="button" class="favorite-toggle"><span class="heart-icon">♥</span> Добавить в избранное</button>
    </div>
    <p class="muted">Категории: <span id="categories"></span></p>

    <article id="content" class="panel article-content"></article>

    <section class="panel rating-comments-section">
      <h2 style="text-align: center;">Оцените статью</h2>
      <div id="rateButtons" class="rating-stars-large">
        <button type="button" data-rate="1" title="1 звезда - непонятно" aria-label="1 звезда">
          <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" data-rate="2" title="2 звезды" aria-label="2 звезды">
          <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" data-rate="3" title="3 звезды - нормально" aria-label="3 звезды">
          <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" data-rate="4" title="4 звезды" aria-label="4 звезды">
          <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" data-rate="5" title="5 звезд - очень понятно" aria-label="5 звезд">
          <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
      </div>
      <p id="ratingStatus" class="rating-status" role="status"></p>
      
      <div class="comments-divider"></div>
      
      <h2 style="text-align: center;">Комментарии</h2>
      <div id="feedbackAuthActions" class="stack-inline comments-auth-actions" hidden>
        <button id="articleLoginBtn" type="button" class="secondary">Войти</button>
        <button id="articleRegisterBtn" type="button">Регистрация</button>
      </div>
      <div class="comments-form-wrapper">
        <form id="commentForm" class="stack">
          <textarea id="commentText" rows="4" placeholder="Что было понятно, а что нет?"></textarea>
          <button id="commentSubmit" type="submit">Отправить комментарий</button>
        </form>
      </div>
      <ul id="commentsList" class="comments-list"></ul>
    </section>

    <section class="panel help-section">
      <h2 style="text-align: center;">Не помогло?</h2>
      <p class="muted">Попробуйте похожие статьи.</p>
      <ul id="similarList"></ul>
    </section>

    <p id="articleStatus" class="status"></p>
  </main>

  <script src="js/app.js"></script>
  <script src="js/article.js"></script>
</body>
</html>
