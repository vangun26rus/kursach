server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Поддержка SPA: все маршруты ведут на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Health-check endpoint для мониторинга ===
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}