<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель автора</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <nav class="links top-nav">
      <div class="nav-left">
        <a href="index.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;margin-right:6px;"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
          Главная
        </a>
        <a href="catalog.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;margin-right:6px;"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          Каталог
        </a>
      </div>
      <div class="nav-right">
          <a href="support.html" class="help-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <circle cx="9" cy="9" r="1"></circle>
            <circle cx="15" cy="9" r="1"></circle>
            <path d="M9 13h.01"></path>
            <path d="M15 13h.01"></path>
            <path d="M10 17h4"></path>
          </svg>
          Обращения и чаты
        </a>
        </div>
    </nav>
    <h1>Панель автора</h1>
    <section class="panel" id="authorStats"></section>

    <section class="panel">
      <h2 id="articleEditorTitle">Создать статью</h2>
      <p id="articleEditorHint" class="muted" hidden>Режим редактирования статьи.</p>
      <form id="articleForm" class="stack">
        <input id="articleTitle" type="text" placeholder="Заголовок" required>
        <input id="articleSummary" type="text" placeholder="Краткое описание">
        <section class="panel">
          <h3>Шаблон шага с картинкой</h3>
          <p class="muted">Добавьте шаг, при необходимости прикрепите изображение, затем шаг появится в HTML статьи.</p>
          <div class="stack">
            <label for="stepText">Текст шага</label>
            <textarea id="stepText" rows="3" placeholder="Например: Нажмите кнопку «Настройки»"></textarea>
            <label for="stepImage">Картинка шага (необязательно)</label>
            <input id="stepImage" type="file" accept="image/*">
            <label for="stepImageAlt">Описание картинки (alt)</label>
            <input id="stepImageAlt" type="text" placeholder="Например: Кнопка настроек в правом верхнем углу">
            <div class="stack-inline">
              <button id="addStepBtn" type="button">Добавить шаг</button>
              <button id="importStepsBtn" type="button" class="secondary">Загрузить шаги из HTML</button>
              <button id="clearStepsBtn" type="button" class="secondary">Очистить шаги</button>
            </div>
            <ul id="stepsPreview"></ul>
          </div>
        </section>
        <textarea id="articleContent" rows="8" placeholder="<p>HTML-контент статьи</p>" required></textarea>
        <input id="articleCategories" type="text" placeholder="Категории через запятую, например: Почта, Безопасность">
        <input id="articleKeywords" type="text" placeholder="Ключевые слова через запятую">
        <select id="articleStatus">
          <option value="Published">Опубликовать</option>
          <option value="Draft">Черновик</option>
          <option value="Archived">Архив</option>
        </select>
        <div class="stack-inline">
          <button id="articleSaveBtn" type="submit">Сохранить статью</button>
          <button id="articleCancelBtn" type="button" class="secondary" hidden>Отменить редактирование</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Мои статьи</h2>
      <ul id="myArticles"></ul>
    </section>

    <p id="authorStatus" class="status"></p>
  </main>

  <script src="js/app.js?v=5"></script>
  <script src="js/author.js?v=5"></script>
</body>
</html>
